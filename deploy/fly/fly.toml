# Gitea on Fly.io — the self-hosted git backend for Swimlane Cloud.
# A managed alternative to the EC2 setup: built-in TLS + a persistent volume,
# so there is no Nginx, no Certbot, and no SSL renewal cron to run.
#
# Deploy (see README "Part 1 (Alternative) — Gitea on Fly.io"):
#   cd deploy/fly
#   fly apps create <your-app>
#   fly volumes create gitea_data --app <your-app> --region iad --size 10
#   fly secrets set --app <your-app> \
#     GITEA__security__SECRET_KEY="$(openssl rand -hex 32)" \
#     GITEA__security__INTERNAL_TOKEN="$(openssl rand -hex 32)"
#   fly deploy --app <your-app>

app = "swimlane-gitea"          # change to your globally-unique app name
primary_region = "iad"          # pick a region near your S3 bucket (iad ≈ us-east-1)

[build]
  image = "gitea/gitea:1.22"    # official image — no Dockerfile needed

[env]
  USER_UID = "1000"
  USER_GID = "1000"
  GITEA__server__HTTP_PORT = "3000"
  GITEA__server__DISABLE_SSH = "true"
  # Update to your custom domain if you add one (Step 6); keep the trailing slash.
  GITEA__server__ROOT_URL = "https://swimlane-gitea.fly.dev/"
  # SQLite on the persistent volume — no separate database to operate.
  GITEA__database__DB_TYPE = "sqlite3"
  GITEA__database__PATH = "/data/gitea/gitea.db"
  GITEA__security__INSTALL_LOCK = "true"
  GITEA__service__DISABLE_REGISTRATION = "true"
  GITEA__service__REQUIRE_SIGNIN_VIEW = "true"
  GITEA__log__LEVEL = "Warn"
  # SECRET_KEY + INTERNAL_TOKEN are set via `fly secrets set` (never commit them).

[http_service]
  internal_port = 3000
  force_https = true
  # Gitea is the always-on git backend; never let Fly stop the only machine.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# Persists every git repository + the SQLite DB across deploys and restarts.
# A volume attaches to a single machine — keep this app at one machine.
[[mounts]]
  source = "gitea_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
