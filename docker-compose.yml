services:
  # ─── Gitea database ────────────────────────────────────────────────────────
  gitea-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GITEA_DB_USER:-gitea}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
      POSTGRES_DB: ${GITEA_DB_NAME:-gitea}
    volumes:
      - gitea_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GITEA_DB_USER:-gitea}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ─── Gitea (git server) ────────────────────────────────────────────────────
  gitea:
    image: gitea/gitea:1.22
    restart: unless-stopped
    depends_on:
      gitea-db:
        condition: service_healthy
    environment:
      USER_UID: 1000
      USER_GID: 1000
      # Server
      GITEA__server__DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__ROOT_URL: https://${GITEA_DOMAIN}/
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__DISABLE_SSH: "true"
      # Database
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER: ${GITEA_DB_USER:-gitea}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      # Security
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN}
      # Registration — bot account only; no self-signup
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      # Mailer — AWS SES via SMTP (set GITEA_MAILER_ENABLED=true to enable)
      GITEA__mailer__ENABLED: ${GITEA_MAILER_ENABLED:-false}
      GITEA__mailer__PROTOCOL: smtp
      GITEA__mailer__SMTP_ADDR: email-smtp.${AWS_REGION:-us-east-1}.amazonaws.com
      GITEA__mailer__SMTP_PORT: 587
      GITEA__mailer__USER: ${SES_SMTP_USER:-}
      GITEA__mailer__PASSWD: ${SES_SMTP_PASSWORD:-}
      GITEA__mailer__FROM: ${GITEA_SES_FROM:-}
      GITEA__log__LEVEL: Warn
    volumes:
      - gitea_data:/data
    networks:
      - backend

  # ─── Nginx (reverse proxy + SSL termination) ───────────────────────────────
  # The Next.js app runs on Vercel — this proxy is Gitea only.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - gitea
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - backend

  # ─── Certbot (run once manually; renewal via host cron) ───────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    profiles: ["certbot"]
    command: >
      certonly --webroot
      --webroot-path=/var/www/certbot
      --email ${CERTBOT_EMAIL}
      --agree-tos
      --no-eff-email
      -d ${GITEA_DOMAIN}

volumes:
  gitea_data:
  gitea_db_data:
  certbot_www:
  certbot_certs:

networks:
  # Single bridge network — the EC2 security group (ports 80/443 only) is the
  # external firewall. No internal: true so Gitea can reach SES SMTP outbound.
  backend:
    driver: bridge
