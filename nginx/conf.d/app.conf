# ── Gitea (git.yourdomain.com) ─────────────────────────────────────────────
# Replace GITEA_DOMAIN_PLACEHOLDER with your actual domain before first boot:
#   sed -i "s/GITEA_DOMAIN_PLACEHOLDER/${GITEA_DOMAIN}/g" nginx/conf.d/app.conf
server {
    listen 443 ssl;
    http2 on;
    server_name GITEA_DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/GITEA_DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/GITEA_DOMAIN_PLACEHOLDER/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers — defined here (not inherited from http{}) because nginx
    # drops all parent add_header directives once a child block defines its own.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Allow large git payloads
    client_max_body_size 500M;

    location / {
        proxy_pass         http://gitea:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
